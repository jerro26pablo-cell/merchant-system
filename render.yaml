services:
  - type: web
    name: online-merchant
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput --clear
    startCommand: sh -c "python manage.py migrate --noinput && python manage.py seed_data && uvicorn config.asgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: PYTHONUNBUFFERED
        value: "1"
