services:
  - type: web
    name: merchant-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: online_merchant-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
