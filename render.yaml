services:
  - type: web
    name: online-merchant
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput --clear && python manage.py check_db && python manage.py migrate --noinput && python manage.py seed_data
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: online_merchant-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: PYTHONUNBUFFERED
        value: "1"
databases:
  - name: online_merchant-db
    plan: free
