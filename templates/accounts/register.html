{% extends 'base.html' %}

{% block title %}Register - Welcome Online Merchant{% endblock %}

{% block extra_css %}
<style>
    .register-container {
        max-width: 500px;
        margin: 2rem auto;
    }
    
    .register-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        overflow: hidden;
    }
    
    .register-header {
        background: var(--gradient-primary);
        padding: 2rem;
        text-align: center;
        color: white;
    }
    
    .register-header h2 {
        font-weight: 800;
        margin-bottom: 0.5rem;
    }
    
    .register-header p {
        opacity: 0.9;
        margin: 0;
    }
    
    .register-body {
        padding: 2.5rem;
    }
    
    .form-floating {
        margin-bottom: 1.5rem;
    }
    
    .form-floating > .form-control {
        border-radius: 12px;
        border: 2px solid var(--border-color);
        padding: 1rem 1.25rem;
        height: auto;
    }
    
    .form-floating > .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }
    
    .form-floating > label {
        padding: 1rem 1.25rem;
        color: var(--text-secondary);
    }
    
    .form-floating > .form-control:focus ~ label,
    .form-floating > .form-control:not(:placeholder-shown) ~ label {
        color: var(--primary-color);
    }
    
    .btn-register {
        background: var(--gradient-primary);
        border: none;
        color: white;
        font-weight: 700;
        padding: 1rem 2rem;
        border-radius: 12px;
        width: 100%;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        box-shadow: var(--shadow-md);
    }
    
    .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
    }
    
    .login-link {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--text-secondary);
    }
    
    .login-link a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
    }
    
    .login-link a:hover {
        text-decoration: underline;
    }
    
    .dropdown-container {
        position: relative;
    }
    
    .dropdown-loading {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        display: none;
    }
    
    .dropdown-loading.show {
        display: block;
    }
    
    .spinner-border-sm {
        width: 1rem;
        height: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <h2>Create Account</h2>
            <p>Join our marketplace today</p>
        </div>
        <div class="register-body">
            <form method="POST" id="registrationForm">
                {% csrf_token %}
                
                <div class="form-floating">
                    <input type="text" class="form-control" name="username" id="id_username" placeholder="Username" required>
                    <label for="id_username">Username</label>
                </div>
                
                <div class="form-floating">
                    <input type="email" class="form-control" name="email" id="id_email" placeholder="Email" required>
                    <label for="id_email">Email</label>
                </div>
                
                <div class="form-floating">
                    <input type="text" class="form-control" name="first_name" id="id_first_name" placeholder="First Name" required>
                    <label for="id_first_name">First Name</label>
                </div>
                
                <div class="form-floating">
                    <input type="text" class="form-control" name="last_name" id="id_last_name" placeholder="Last Name" required>
                    <label for="id_last_name">Last Name</label>
                </div>
                
                <div class="dropdown-container mb-3">
                    <label class="form-label">Province</label>
                    <select class="form-select" name="province" id="province" required>
                        <option value="">Select Province</option>
                    </select>
                    <div class="dropdown-loading" id="municipalityLoading">
                        <div class="spinner-border spinner-border-sm text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
                
                <div class="dropdown-container mb-3">
                    <label class="form-label">Municipality/City</label>
                    <select class="form-select" name="municipality" id="municipality" required disabled>
                        <option value="">Select Municipality/City</option>
                    </select>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" name="password1" id="id_password1" placeholder="Password" required>
                    <label for="id_password1">Password</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" name="password2" id="id_password2" placeholder="Confirm Password" required>
                    <label for="id_password2">Confirm Password</label>
                </div>
                
                <button type="submit" class="btn-register">Create Account</button>
            </form>
            
            <div class="login-link">
                Already have an account? <a href="{% url 'login' %}">Login here</a>
            </div>
        </div>
    </div>
</div>

// Populate provinces dropdown
const provinceSelect = document.getElementById('province');
const municipalitySelect = document.getElementById('municipality');
const municipalityLoading = document.getElementById('municipalityLoading');

// Populate provinces
Object.keys(philippineData).sort().forEach(province => {
    const option = document.createElement('option');
    option.value = province;
    option.textContent = province;
    provinceSelect.appendChild(option);
});

// Handle province change
provinceSelect.addEventListener('change', function() {
    const selectedProvince = this.value;
    
    // Clear and disable municipality dropdown
    municipalitySelect.innerHTML = '<option value="">Select Municipality/City</option>';
    municipalitySelect.disabled = true;
    
    if (selectedProvince) {
        // Show loading
        municipalityLoading.classList.add('show');
        
        // Simulate loading delay for better UX
        setTimeout(() => {
            const municipalities = philippineData[selectedProvince];
            municipalities.sort().forEach(municipality => {
                const option = document.createElement('option');
                option.value = municipality;
                option.textContent = municipality;
                municipalitySelect.appendChild(option);
            });
            
            // Enable municipality dropdown
            municipalitySelect.disabled = false;
            municipalityLoading.classList.remove('show');
        }, 300);
    }
});

// Form validation
document.getElementById('registrationForm').addEventListener('submit', function(e) {
    const province = provinceSelect.value;
    const municipality = municipalitySelect.value;
    
    if (!province || !municipality) {
        e.preventDefault();
        alert('Please select both province and municipality/city');
        return false;
    }
});
</script>
